name: MLB Schedule Cache Acquisition

on:
  push:
    branches: ['research/mlb-validation-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire authoritative 2012-2021 schedule/results cache
        run: |
          python scripts/research_acquire_mlb_schedule_cache.py \
            --start-year 2012 \
            --end-year 2021 \
            --output-dir results/mlb-schedule-cache

      - name: Verify exact season coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('results/mlb-schedule-cache')
          manifest = json.loads((root / 'schedule-cache-manifest.json').read_text())
          assert [x['season'] for x in manifest['seasons']] == list(range(2012, 2022)), manifest
          assert manifest['total_games'] > 20000, manifest['total_games']
          for record in manifest['seasons']:
              payload = json.loads((root / record['file']).read_text())
              assert payload['season'] == record['season']
              assert payload['audit']['final_regular_season_games'] == record['game_count']
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload immutable schedule cache
        uses: actions/upload-artifact@v4
        with:
          name: mlb-schedule-cache-2012-2021-${{ github.sha }}
          path: results/mlb-schedule-cache/
          if-no-files-found: error
          retention-days: 7
