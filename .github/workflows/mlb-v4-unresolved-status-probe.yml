name: MLB v4 unresolved status probe

on:
  push:
    branches: ['research/mlb-v4-unresolved-status-probe-*']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact validated source SHA
        uses: actions/checkout@v4
        with:
          ref: 63c5f36a9835d287947eda440326ec1d5c2bbea4
          fetch-depth: 1

      - name: Probe authoritative live statuses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          pks=[415766,449187,449244,449246,531548,567304,631131,631471,631472,632457]
          out=[]
          for pk in pks:
              req=Request(f'https://statsapi.mlb.com/api/v1.1/game/{pk}/feed/live',headers={'User-Agent':'Doctore-Sports/1.0 status-probe','Accept':'application/json'})
              with urlopen(req,timeout=90) as r:
                  payload=json.loads(r.read().decode('utf-8'))
              gd=payload.get('gameData') or {}
              st=gd.get('status') or {}
              dt=gd.get('datetime') or {}
              game=gd.get('game') or {}
              ls=(payload.get('liveData') or {}).get('linescore') or {}
              row={
                  'game_pk':pk,
                  'game_type':game.get('type'),
                  'official_date':dt.get('officialDate'),
                  'statusCode':st.get('statusCode'),
                  'codedGameState':st.get('codedGameState'),
                  'abstractGameState':st.get('abstractGameState'),
                  'detailedState':st.get('detailedState'),
                  'reason':st.get('reason'),
                  'scheduledInnings':ls.get('scheduledInnings') or game.get('scheduledInnings'),
              }
              out.append(row)
              print(json.dumps(row,sort_keys=True),flush=True)
          open('mlb-v4-unresolved-statuses.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v4-unresolved-statuses
          path: mlb-v4-unresolved-statuses.json
          retention-days: 30
