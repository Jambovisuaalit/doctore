name: MLB offense history 2012-2021

on:
  push:
    branches: ['research/mlb-offense-history-2012-2021-*']

permissions:
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        season: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: 8cfc194c81dc6d6791478c4a06b590f7e2daccba
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire season offense history
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_mlb_v4_offense_history.py \
            --season ${{ matrix.season }} \
            --workers 6 \
            --output-dir results/mlb-offense-${{ matrix.season }}
      - name: Verify offense history hard gates
        shell: bash
        env:
          SEASON: ${{ matrix.season }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from hashlib import sha256
          from pathlib import Path
          season=os.environ['SEASON']
          root=Path(f'results/mlb-offense-{season}')
          raw=(root/'manifest.json').read_bytes()
          m=json.loads(raw)
          assert sha256(raw).hexdigest()==(root/'manifest.sha256').read_text().strip()
          assert m['schema_version']=='doctore.mlb-offense-history-manifest.v1'
          assert m['policy']=='authoritative_complete_played_offense_history_v1'
          assert m['reject_count']==0, m
          assert m['normalized_records']==m['classified_played_games'], m
          assert m['target_domain_records']+m['supplemental_played_records']==m['normalized_records'], m
          records_raw=(root/m['records_file']).read_bytes()
          assert sha256(records_raw).hexdigest()==m['records_sha256']
          rows=[json.loads(line) for line in records_raw.splitlines() if line.strip()]
          assert len(rows)==m['normalized_records']
          assert len({int(r['game_pk']) for r in rows})==len(rows)
          assert all(r['offense_status']=='PASS' and r['offense_history_eligible'] is True for r in rows)
          for r in rows:
              for side in ('away_batting','home_batting'):
                  b=r[side]
                  assert int(b['plate_appearances'])>0
                  assert 0<=int(b['walks'])<=int(b['plate_appearances'])
                  assert 0<=int(b['strikeouts'])<=int(b['plate_appearances'])
                  assert 0<=int(b['home_runs'])<=int(b['hits'])<=int(b['plate_appearances'])
          print(json.dumps({
              'season':m['season'],
              'normalized_records':m['normalized_records'],
              'target_domain_records':m['target_domain_records'],
              'supplemental_played_records':m['supplemental_played_records'],
              'skip_count':m['skip_count'],
              'reject_count':m['reject_count'],
              'domain_role_counts':m['domain_role_counts'],
          },sort_keys=True))
          PY
      - name: Upload immutable offense artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-offense-${{ matrix.season }}-8cfc194c
          path: results/mlb-offense-${{ matrix.season }}/
          if-no-files-found: error
          retention-days: 30
