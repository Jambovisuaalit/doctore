name: CI Diagnostics and Verification

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: P0 Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Runner and connectivity diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Date: $(date -u --iso-8601=seconds)"
            echo "Runner: ${RUNNER_OS:-unknown}"
            uname -a
            python --version
            python -m pip --version
            node --version
            npm --version
            echo "--- DNS ---"
            getent hosts pypi.org
            getent hosts registry.npmjs.org
            getent hosts raw.githubusercontent.com
            echo "--- HTTPS ---"
            curl --fail --silent --show-error --head --max-time 10 https://pypi.org/
            curl --fail --silent --show-error --head --max-time 10 https://registry.npmjs.org/
            curl --fail --silent --show-error --head --max-time 10 https://raw.githubusercontent.com/
          } > connectivity.log 2>&1
          exit 0

      - name: Upload connectivity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-log-${{ github.sha }}
          path: connectivity.log
          if-no-files-found: error

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.11-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-pip-

      - name: Install dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r requirements.txt; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Compile Python sources
        run: python -m compileall -q src scripts doctore_mcp tests

      - name: Verify locked session MCP baseline
        run: python doctore_mcp/baseline/session_v1/materialize.py --verify-only

      - name: Run full unit and golden differential suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee results/unittest.log

      - name: Run MCP Inspector 10-of-10 smoke suite
        shell: bash
        run: |
          set -euo pipefail
          python doctore_mcp/scripts/run_inspector_smoke.py --repo "$PWD" 2>&1 | tee results/inspector.log
          grep -F "Inspector smoke suite passed: 10/10 expected tools" results/inspector.log

      - name: Record exact-SHA verification evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": "doctore.p0-verification.v1",
              "commit_sha": os.environ["GITHUB_SHA"],
              "unit_suite": "PASS",
              "mcp_inspector": "10/10 PASS",
              "same_sha_verified": True,
          }
          Path("results").mkdir(exist_ok=True)
          Path("results/p0-verification.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-verification-${{ github.sha }}
          path: results/
          if-no-files-found: warn
