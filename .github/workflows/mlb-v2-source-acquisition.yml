name: MLB v2 source acquisition

on:
  push:
    branches: ['research/mlb-v2-acquisition-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        season: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire season feature sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_mlb_v2_sources.py \
            --season ${{ matrix.season }} \
            --workers 6 \
            --output-dir results/mlb-v2-source-${{ matrix.season }}

      - name: Verify artifact hashes and completeness invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import os

          season = os.environ['SEASON']
          root = Path(f'results/mlb-v2-source-{season}')
          manifest_bytes = (root / 'manifest.json').read_bytes()
          manifest = json.loads(manifest_bytes)
          expected = (root / 'manifest.sha256').read_text().strip()
          assert sha256(manifest_bytes).hexdigest() == expected
          assert manifest['schema_version'] == 'doctore.mlb-feature-source-manifest.v2'

          records_path = root / manifest['records_file']
          records_bytes = records_path.read_bytes()
          assert sha256(records_bytes).hexdigest() == manifest['records_sha256']
          records = [json.loads(line) for line in records_bytes.splitlines() if line.strip()]
          assert len(records) == manifest['normalized_source_records']
          assert len({row['game_pk'] for row in records}) == len(records)

          rejects_path = root / 'rejects.json'
          rejects_bytes = rejects_path.read_bytes()
          assert sha256(rejects_bytes).hexdigest() == manifest['rejects_sha256']
          reject_payload = json.loads(rejects_bytes)
          assert reject_payload['schema_version'] == 'doctore.mlb-feature-source-rejects.v2'
          rejects = reject_payload['rejects']

          # Unique strict-final gamePks partition into schedule-domain/conflict exclusions
          # plus candidates that proceed to optional hydration/source acquisition.
          assert manifest['strict_final_unique_game_pks'] == (
              manifest['schedule_candidates']
              + manifest['known_domain_exclusions']
              + manifest['strict_final_conflicts']
          )
          assert manifest['eligible_schedule_games'] == manifest['schedule_candidates']

          # Every candidate has exactly one terminal outcome.
          assert manifest['schedule_candidates'] == (
              manifest['normalized_source_records']
              + manifest['timestamp_or_core_reject_count']
              + manifest['hydration_reject_count']
              + manifest['hydrated_domain_exclusions']
          )
          assert manifest['hydration_attempted'] == (
              manifest['hydrated_candidates']
              + manifest['hydration_reject_count']
              + manifest['hydrated_domain_exclusions']
          )

          # Reschedule/postponed rows are metadata, never fake field-missing rejects.
          assert manifest['duplicate_schedule_rows'] >= manifest['reschedule_or_nonfinal_metadata_rows']
          assert 'SCHEDULE_FIELDS_MISSING' not in manifest['reason_counts']

          assert manifest['park_pass_records'] == manifest['normalized_source_records']
          assert manifest['bullpen_pass_records'] + manifest['bullpen_blocked_records'] == manifest['normalized_source_records']
          assert sum(1 for row in records if row['park_status'] == 'PASS') == manifest['park_pass_records']
          assert sum(1 for row in records if row['bullpen_status'] == 'PASS') == manifest['bullpen_pass_records']
          assert sum(1 for row in records if row['bullpen_status'] == 'BLOCKED') == manifest['bullpen_blocked_records']

          source_rejects = [row for row in rejects if row.get('stage') == 'source']
          assert len(source_rejects) == manifest['timestamp_or_core_reject_count']
          required_source_context = {
              'game_pk', 'event_id', 'official_date', 'event_start_at',
              'venue_id', 'away_team_id', 'home_team_id', 'reason', 'detail',
          }
          for row in source_rejects:
              assert required_source_context.issubset(row), row
              assert all(row.get(key) is not None for key in required_source_context - {'detail'}), row

          assert manifest['acquisition_policy'] == 'strict_final_gamepk_dedupe_live_hydration_fail_closed_v2'
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
        env:
          SEASON: ${{ matrix.season }}

      - name: Upload immutable season source artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v2-feature-sources-${{ matrix.season }}-${{ github.sha }}
          path: results/mlb-v2-source-${{ matrix.season }}/
          if-no-files-found: error
          retention-days: 7
