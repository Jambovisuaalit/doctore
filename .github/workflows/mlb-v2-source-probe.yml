name: MLB v2 source probe

on:
  push:
    branches: ['research/mlb-v2-source-probe']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe lightweight historical endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          game_pk = 346942
          headers = {'User-Agent': 'Doctore-Sports/1.0 research-probe'}

          def get(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=90) as response:
                  raw = response.read()
              return raw, json.loads(raw.decode('utf-8'))

          ts_raw, timestamps = get(f'https://statsapi.mlb.com/api/v1.1/game/{game_pk}/feed/live/timestamps')
          print('timestamps_type', type(timestamps).__name__)
          print('timestamps', json.dumps(timestamps, sort_keys=True)[:5000])
          print('timestamps_bytes', len(ts_raw))

          box_raw, box = get(f'https://statsapi.mlb.com/api/v1/game/{game_pk}/boxscore')
          print('boxscore_bytes', len(box_raw))
          print('boxscore_info', json.dumps(box.get('info', []), sort_keys=True))
          teams = box.get('teams', {})
          for side in ('away', 'home'):
              team = teams.get(side, {})
              print(side, 'team', json.dumps(team.get('team', {}), sort_keys=True))
              print(side, 'pitchers', team.get('pitchers', []))
              players = team.get('players', {})
              for pid in team.get('pitchers', []):
                  stats = players.get(f'ID{pid}', {}).get('stats', {}).get('pitching', {})
                  print(side, pid, json.dumps({
                      'gamesStarted': stats.get('gamesStarted'),
                      'gamesPitched': stats.get('gamesPitched'),
                      'pitchesThrown': stats.get('pitchesThrown'),
                      'numberOfPitches': stats.get('numberOfPitches'),
                      'inningsPitched': stats.get('inningsPitched'),
                  }, sort_keys=True))
          PY
