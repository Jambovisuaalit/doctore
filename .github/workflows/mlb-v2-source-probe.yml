name: MLB v2 source probe

on:
  push:
    branches: ['research/mlb-v2-source-probe']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe 2012 schedule rejects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          game_pks = [317795, 317938, 317966, 318066, 320089]
          headers = {'User-Agent': 'Doctore-Sports/1.0 research-probe'}

          def get(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=90) as response:
                  return json.loads(response.read().decode('utf-8'))

          for game_pk in game_pks:
              payload = get(f'https://statsapi.mlb.com/api/v1.1/game/{game_pk}/feed/live')
              gd = payload.get('gameData', {})
              live = payload.get('liveData', {})
              box = live.get('boxscore', {})
              linescore = live.get('linescore', {})
              summary = {
                  'gamePk': game_pk,
                  'status': gd.get('status', {}),
                  'datetime': gd.get('datetime', {}),
                  'venue': gd.get('venue', {}),
                  'away_team': ((gd.get('teams') or {}).get('away') or {}).get('name'),
                  'home_team': ((gd.get('teams') or {}).get('home') or {}).get('name'),
                  'linescore_teams': linescore.get('teams', {}),
                  'boxscore_team_ids': {
                      side: (((box.get('teams') or {}).get(side) or {}).get('team') or {}).get('id')
                      for side in ('away', 'home')
                  },
                  'timestamps_last': (payload.get('metaData') or {}).get('timeStamp'),
              }
              print(json.dumps(summary, sort_keys=True))
          PY
